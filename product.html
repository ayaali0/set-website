<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SET — Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bone:#EDEAE2; --bone-dim:#E2DED3; --ink:#17181C; --navy:#223047;
    --brass:#B08D57; --maroon:#7A1018; --grey:#8A8A86; --line:rgba(23,24,28,0.14); --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bone); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  a{color:inherit; text-decoration:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:20px 5vw; border-bottom:1px solid var(--line);
  }
  .logo-img{ height:clamp(50px, 12vw, 90px); width:auto; justify-self:center; }
  .back-link{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--grey); justify-self:start; }
  .cart-link{ justify-self:end; font-family:'IBM Plex Mono',monospace; font-size:12px; display:flex; align-items:center; gap:6px; }
  .cart-count{ background:var(--ink); color:var(--bone); font-size:10px; border-radius:50%; width:16px; height:16px; display:flex; align-items:center; justify-content:center; }

  .product-wrap{ display:grid; grid-template-columns:1.1fr 1fr; gap:50px; max-width:1100px; margin:0 auto; padding:50px 5vw 100px; }
  .gallery{ display:flex; flex-direction:column; gap:10px; }
  .gallery img{ width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:2px; }
  .gallery-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grey); text-transform:uppercase; margin-top:-4px; }

  .info .code{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--grey); margin-bottom:10px; }
  .info h1{ font-family:'Fraunces',serif; font-weight:500; font-size:30px; margin-bottom:8px; }
  .info .price{ font-family:'IBM Plex Mono',monospace; font-size:18px; color:var(--navy); margin-bottom:20px; }
  .info .desc{ font-size:14.5px; line-height:1.7; color:#3c3d41; margin-bottom:24px; }

  .attr-block{ margin-bottom:22px; }
  .attr-block h4{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--navy); margin-bottom:10px; }
  .color-row{ display:flex; gap:10px; }
  .color-chip{
    padding:8px 14px; border:1px solid var(--line); border-radius:2px; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--white);
  }
  .color-chip.selected{ background:var(--ink); color:var(--bone); border-color:var(--ink); }
  .size-selector{display:flex; gap:8px;}
  .size-chip{
    width:38px; height:38px; border:1px solid var(--line); background:var(--white);
    font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer; border-radius:2px;
  }
  .size-chip:hover{border-color:var(--ink);}
  .size-chip.selected{background:var(--ink); color:var(--bone); border-color:var(--ink);}

  .add-btn{
    margin-top:10px; width:100%; padding:15px; background:var(--ink); color:var(--bone);
    border:none; font-family:'IBM Plex Mono',monospace; font-size:13px; cursor:pointer; border-radius:2px;
  }
  .add-btn:hover{ background:var(--navy); }

  .payment-note{
    margin-top:26px; padding:16px; border:1px dashed var(--line); border-radius:3px;
    font-size:12.5px; color:var(--grey); line-height:1.7;
  }
  .payment-note strong{ color:var(--ink); }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bone); padding:14px 22px; border-radius:2px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; z-index:200; opacity:0;
    transition:all .3s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:820px){
    .product-wrap{ grid-template-columns:1fr; gap:30px; padding:30px 5vw 80px; }
  }
</style>
</head>

  const products = [
    {id:'01', name:'Structured Overcoat', price:6800, desc:'Wool-blend, boxy fit', material:'70% wool, 30% polyester blend', colors:['Charcoal','Camel'], img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=900&q=80&auto=format&fit=crop'},

  function formatEGP(amount){ return `E£${amount.toLocaleString('en-US')}`; }

  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id') || '01';
  const product = products.find(p => p.id === productId) || products[0];

  let selectedColor = product.colors[0];
  let selectedSize = null;

  function renderProduct(){
    document.getElementById('productWrap').innerHTML = `
      <div class="gallery">
        <img src="${product.img}" alt="${product.name} — front">
        <div class="gallery-label">Front view</div>
        <img src="${product.img}" alt="${product.name} — back">
        <div class="gallery-label">Back view — placeholder, replace with real back-view photo</div>
      </div>
      <div class="info">
        <div class="code mono">{ ${product.id} }</div>
        <h1>${product.name}</h1>
        <div class="price">${formatEGP(product.price)}</div>
        <p class="desc">${product.desc}. Made from ${product.material}.</p>

        <div class="attr-block">
          <h4>Material</h4>
          <p style="font-size:13.5px; color:#3c3d41;">${product.material}</p>
        </div>

        <div class="attr-block">
          <h4>Color</h4>
          <div class="color-row">
            ${product.colors.map(c => `<button type="button" class="color-chip ${c===selectedColor?'selected':''}" onclick="selectColor('${c}', this)">${c}</button>`).join('')}
          </div>
        </div>

        <div class="attr-block">
          <h4>Size</h4>
          <div class="size-selector">
            ${['S','M','L','XL'].map(s => `<button type="button" class="size-chip" onclick="selectSize('${s}', this)">${s}</button>`).join('')}
          </div>
        </div>

        <button class="add-btn" onclick="addToBag()">Add to bag — ${formatEGP(product.price)}</button>

        <div class="payment-note">
          <strong>Payment methods:</strong> Card / Apple Pay (coming soon), or Cash on Delivery with a 50% InstaPay deposit to confirm your order — the rest is paid when it arrives. Delivery cost is calculated separately at checkout based on your governorate.
        </div>
      </div>
    `;
  }

  function selectColor(c, el){
    selectedColor = c;
    el.parentElement.querySelectorAll('.color-chip').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
  }

  function selectSize(s, el){
    selectedSize = s;
    el.parentElement.querySelectorAll('.size-chip').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
  }

  function addToBag(){
    if(!selectedSize){
      showToast('Please select a size first.');
      return;
    }
    let cart = JSON.parse(localStorage.getItem('set_cart') || '[]');
    cart.push({
      id: product.id, name: product.name, price: product.price,
      desc: product.desc, img: product.img, size: selectedSize, color: selectedColor
    });
    localStorage.setItem('set_cart', JSON.stringify(cart));
    updateCartCount();
    showToast(`${product.name} added to your bag.`);
  }

  function updateCartCount(){
    let cart = JSON.parse(localStorage.getItem('set_cart') || '[]');
    document.getElementById('cartCount').textContent = cart.length;
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  renderProduct();
  updateCartCount();
</script>
